# Cloudflare Worker for the Face Analyser (AI proxy).
# Cloudflare builds this automatically from GitHub (Workers Builds).
# The website itself is still served by GitHub Pages; this only deploys api/worker.js.
name = "primo-smart-salon"
main = "api/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[vars]
AI_PROVIDER = "gemini"
ALLOWED_ORIGINS = "https://mynampatiasha.github.io"

# The Gemini key is a SECRET: add it in Cloudflare → this Worker → Settings →
# Variables and Secrets → GEMINI_API_KEY (type Secret). Never put it in this file.
